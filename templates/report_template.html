<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отчёт по недвижимости</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
            color: #333;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #007BFF;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .property {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        .title {
            font-size: 1.2em;
            color: #007BFF;
            margin: 0 0 5px 0;
        }
        .price {
            font-size: 1.1em;
            color: #28a745;
            font-weight: bold;
            margin: 5px 0;
        }
        .url {
            color: #007BFF;
            text-decoration: none;
        }
        .url:hover {
            text-decoration: underline;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Отчёт по недвижимости</h1>
        <p>Дата генерации: {{ date }}</p>
    </div>

    {% for prop in properties %}
        <div class="property">
            <h3 class="title">{{ prop.title }}</h3>
            <p class="price">Цена: {{ prop.price }}</p>
            <p><a href="{{ prop.url }}" class="url" target="_blank">🔗 Перейти к объявлению</a></p>
        </div>
    {% endfor %}

    <div class="footer">
        Сгенерировано автоматически системой мониторинга недвижимости.
    </div>
</body>
</html>
